name: Security regressions
on:
  pull_request:
  push:
    branches: ['fix/security-**']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx --no-install tsc --noEmit
      - run: npm run build
        env:
          GEMINI_API_KEY: synthetic-ci-canary-not-a-credential
      - name: Ensure server credential marker stays out of client assets
        run: node -e "const fs=require('fs');for(const f of fs.readdirSync('dist',{recursive:true})){const p='dist/'+f;if(fs.statSync(p).isFile()&&fs.readFileSync(p,'utf8').includes('synthetic-ci-canary-not-a-credential'))process.exit(1)}"
